bundle:
  name: kruger-lakehouse

include:
  - resources/ingestion_pipeline.yml
  - resources/transformation_pipeline.yml
  - resources/orchestration_job.yml
  - resources/dq_dashboard.yml
  - resources/environment_bootstrap_job.yml

sync:
  paths:
    - ../pipelines
    - ../jobs
    - ../setup
    - ../monitoring/dq_dashboard_setup.ipynb

variables:
  kruger_catalog:
    description: Unity Catalog catalog this target reads/writes — same pipeline code, different catalog injected per environment.
    default: dev

  kruger_warehouse_id:
    description: SQL warehouse ID the DQ dashboard queries run against. No sensible default — set per target below.
    default: 7ffa80bc21a73630

  youtube_api_key:
    description: "The API Key for YouTube Ingestion"
  youtube_channel_id:
    description: "The Target YouTube Channel ID"

targets:
  dev:
    default: true
    workspace:
      host: https://databricks.com

  uat:
    workspace:
      host: https://databricks.com
    variables:
      kruger_catalog: uat

  prod:
    workspace:
      host: https://databricks.com
    variables:
      kruger_catalog: prod
      kruger_warehouse_id: e3d4bc3a4cc4b6e3
