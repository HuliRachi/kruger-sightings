resources:
  jobs:
    kruger_orchestration_job:
      name: kruger-orchestration-job
      tags:
        environment: ${bundle.target}
 
      schedule:
        quartz_cron_expression: "0 0 18 ? * MON,FRI"
        timezone_id: "Africa/Johannesburg"
        pause_status: "UNPAUSED"

      email_notifications:
        on_success:
          - "rachyhuly17@gmail.com"
        on_failure:
          - "rachyhuly17@gmail.com"

      parameters:
        - name: run_date
          default: "{{job.start_time.iso_date}}"
 
      tasks:
        - task_key: ingest_to_landing
          notebook_task:
            notebook_path: ../../jobs/ingest_data_to_landing.ipynb
            base_parameters:
              catalog: ${var.kruger_catalog}
              youtube_api_key: ${var.youtube_api_key}
              youtube_channel_id: ${var.youtube_channel_id}
          environment_key: default

        - task_key: ingest_to_staging
          depends_on:
            - task_key: ingest_to_landing
          notebook_task:
            notebook_path: ../../jobs/ingest_data_to_staging.ipynb
            base_parameters:
              catalog: ${var.kruger_catalog}
          environment_key: default

        - task_key: run_ingestion
          depends_on:
            - task_key: ingest_to_staging
          pipeline_task:
            pipeline_id: ${resources.pipelines.kruger_ingestion_pipeline.id}
 
        - task_key: dq_check
          depends_on:
            - task_key: run_ingestion
          spark_python_task:
            python_file: ../../jobs/report.py
            parameters:
              - "--catalog=${var.kruger_catalog}"
              - "--run_date={{job.parameters.run_date}}"
          environment_key: default
 
        - task_key: run_transformation
          depends_on:
            - task_key: dq_check
          pipeline_task:
            pipeline_id: ${resources.pipelines.kruger_transformation_pipeline.id}
 
        - task_key: report
          depends_on:
            - task_key: run_transformation
          spark_python_task:
            python_file: ../../jobs/report.py
            parameters:
              - "--catalog=${var.kruger_catalog}"
              - "--run_date={{job.parameters.run_date}}"
          environment_key: default
          
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
