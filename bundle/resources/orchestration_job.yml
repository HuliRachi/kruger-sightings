resources:
  jobs:
    kruger_orchestration_job:
      name: kruger-orchestration-job
      tags:
        environment: ${bundle.target}
 
      # Trigger schedule updated to run at 18:00 daily
      schedule:
        quartz_cron_expression: "0 0 18 * * ?"
        timezone_id: "Africa/Johannesburg"
        pause_status: "UNPAUSED"

      # Email notifications added for success and failure
      email_notifications:
        on_success:
          - "rachyhuly17@gmail.com"
        on_failure:
          - "rachyhuly17@gmail.com"

      parameters:
        - name: run_date
          default: "{{job.start_time.iso_date}}"
 
      tasks:
        # Task 1: Ingest Data to Landing (Notebook)
        - task_key: ingest_to_landing
          notebook_task:
            notebook_path: ../../jobs/ingest_data_to_landing.ipynb
            base_parameters:
              catalog: ${var.kruger_catalog}
          environment_key: default

        # Task 2: Ingest Data to Staging (Notebook)
        - task_key: ingest_to_staging
          depends_on:
            - task_key: ingest_to_landing
          notebook_task:
            notebook_path: ../../jobs/ingest_data_to_staging.ipynb
            base_parameters:
              catalog: ${var.kruger_catalog}
          environment_key: default

        # Task 3: Run Ingestion DLT Pipeline (Bronze Layer - now runs after staging ingestion)
        - task_key: run_ingestion
          depends_on:
            - task_key: ingest_to_staging
          pipeline_task:
            pipeline_id: ${resources.pipelines.kruger_ingestion_pipeline.id}
 
        # Task 4: Data Quality Verification Audit Checks
        - task_key: dq_check
          depends_on:
            - task_key: run_ingestion
          spark_python_task:
            python_file: ../../jobs/report.py
            parameters:
              - "--catalog=${var.kruger_catalog}"
              - "--run_date={{job.parameters.run_date}}"
          environment_key: default
 
        # Task 5: Run Transformation DLT Pipeline (Silver and Gold Layers)
        - task_key: run_transformation
          depends_on:
            - task_key: dq_check
          pipeline_task:
            pipeline_id: ${resources.pipelines.kruger_transformation_pipeline.id}
 
        # Task 6: Lightweight Summary Report execution step
        - task_key: report
          depends_on:
            - task_key: run_transformation
          spark_python_task:
            python_file: ../../jobs/report.py
            parameters:
              - "--catalog=${var.kruger_catalog}"
              - "--run_date={{job.parameters.run_date}}"
          environment_key: default
          
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
