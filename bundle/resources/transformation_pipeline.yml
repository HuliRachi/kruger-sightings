resources:
  pipelines:
    kruger_transformation_pipeline:
      name: kruger-transformation-pipeline
      serverless: true
      allow_duplicate_names: true
      tags:
        environment: ${bundle.target}

      root_path: ${workspace.file_path}/pipelines/transformation_pipeline

      catalog: ${var.kruger_catalog}
      schema: kruger

      configuration:
        kruger.catalog: ${var.kruger_catalog}

      libraries:
        - glob:
            include: ../../pipelines/transformation_pipeline/transformations/**
