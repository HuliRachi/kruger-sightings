name: Continous-Integration
on:
  push:
    branches: [main]
  pull_request:
    branches: ['feat/**']
  workflow_dispatch:

jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install test dependencies
        run: pip install pytest "pyspark>=3.5"

      - name: Run ingestion_pipeline unit tests
        run: pytest pipelines/ingestion_pipeline/tests -v

      - name: Run transformation_pipeline unit tests
        run: pytest pipelines/transformation_pipeline/tests -v

  validate-and-deploy-uat:
    needs: unit-test
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
      DATABRICKS_WAREHOUSE_ID_UAT: ${{ secrets.DATABRICKS_WAREHOUSE_ID_UAT }}
      # MAP YOUTUBE CREDENTIALS FOR UAT TARGETS
      BUNDLE_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
      BUNDLE_VAR_youtube_channel_id: ${{ vars.YOUTUBE_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FIXED: Uses the raw standalone installer script to guarantee the new bundle-supported CLI is added
      - name: Install New Databricks CLI and SDK
        run: |
          curl -fsSL https://githubusercontent.com | sh
          pip install databricks-sdk==0.67.0

      - name: Ensure target catalog exists
        run: |
          python3 -c "
          import os
          from databricks.sdk import WorkspaceClient
          w = WorkspaceClient(host='https://dbc-7719d447-7a09.cloud.databricks.com/')
          resp = w.statement_execution.execute_statement(
              warehouse_id=os.environ['DATABRICKS_WAREHOUSE_ID_UAT'],
              statement='CREATE CATALOG IF NOT EXISTS uat',
              wait_timeout='30s',
          )
          if resp.status.state.value != 'SUCCEEDED':
              raise SystemExit(f'CREATE CATALOG failed: {resp.status.error}')
          print('Catalog uat ensured (created if missing, no-op if already present)')
          "

      - name: Validate bundle
        working-directory: bundle
        run: databricks bundle validate --target uat

      - name: Deploy bundle
        working-directory: bundle
        run: databricks bundle deploy --target uat

      - name: Run environment bootstrap
        working-directory: bundle
        run: databricks bundle run kruger_environment_bootstrap --target uat

  integration-test:
    needs: validate-and-deploy-uat
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_UAT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # FIXED: Uses the raw standalone installer script to guarantee the new bundle-supported CLI is added
      - name: Install New Databricks CLI and Test dependencies
        run: |
          curl -fsSL https://githubusercontent.com | sh
          pip install pytest faker databricks-sdk==0.67.0

      - name: Run integration tests
        working-directory: tests/integration
        run: pytest test_integration.py -v -s
