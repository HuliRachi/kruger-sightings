name: Deploy To Prod

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DEPLOY PROD" (exact, case-sensitive) to proceed'
        required: true

jobs:
  deploy-prod:
    runs-on: ubuntu-latest
    env:
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN_PROD }}
      DATABRICKS_WAREHOUSE_ID_PROD: ${{ secrets.DATABRICKS_WAREHOUSE_ID_PROD }}
      BUNDLE_VAR_youtube_api_key: ${{ secrets.YOUTUBE_API_KEY }}
      BUNDLE_VAR_youtube_channel_id: ${{ vars.YOUTUBE_CHANNEL_ID }}
    steps:
      - name: Verify confirmation phrase
        run: |
          if [ "${{ github.event.inputs.confirm }}" != "DEPLOY PROD" ]; then
            echo "Confirmation phrase did not match exactly. Aborting — nothing was deployed."
            exit 1
          fi
          echo "Confirmed. Proceeding with prod deployment."

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: databricks/setup-cli@main

      - name: Install smoke test dependencies
        run: pip install pytest databricks-sdk==0.67.0

      - name: Ensure target catalog exists
        run: |
          python3 -c "
          import os
          from databricks.sdk import WorkspaceClient
          w = WorkspaceClient(host='https://databricks.com')
          resp = w.statement_execution.execute_statement(
              warehouse_id=os.environ['DATABRICKS_WAREHOUSE_ID_PROD'],
              statement='CREATE CATALOG IF NOT EXISTS prod',
              wait_timeout='30s',
          )
          if resp.status.state.value != 'SUCCEEDED':
              raise SystemExit(f'CREATE CATALOG failed: {resp.status.error}')
          print('Catalog prod ensured (created if missing, no-op if already present)')
          "

      - name: Validate bundle
        working-directory: bundle
        run: databricks bundle validate --target prod

      - name: Deploy bundle
        working-directory: bundle
        run: databricks bundle deploy --target prod

      - name: Run environment bootstrap
        working-directory: bundle
        run: databricks bundle run kruger_environment_bootstrap --target prod

      - name: Run main data orchestration job
        working-directory: bundle
        run: databricks bundle run kruger_orchestration_job --target prod

      - name: Run smoke tests
        working-directory: tests/smoke
        run: pytest test_smoke.py -v -s
